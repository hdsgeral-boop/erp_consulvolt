# =============================================================================================
# ERP_CONSULVOLT — Blueprint da RENDER.COM (plano FREE). Deploy em 1 clique:
#   Render Dashboard › New › Blueprint › repositório hdsgeral-boop/erp_consulvolt › branch «render».
# Este ficheiro só existe no branch «render» (cópia erp_laravel_render). A produção AWS (branch main) não o usa.
#
# Serviços:
#   1. erp-consulvolt-render-api  Web Service Docker (nginx + PHP 8.3-FPM na porta $PORT) -> Supabase Postgres
#   2. erp-consulvolt-render-web  Static Site (Vite SPA) que chama a API via VITE_API_URL
#
# Variáveis com «sync: false» são pedidas pelo painel na criação do Blueprint (segredos: nunca no Git).
# Se a Render acrescentar um sufixo aos nomes (subdomínio já ocupado), corrigir APP_URL, ERP_CORS_ORIGENS,
# VITE_API_URL e o connect-src da CSP abaixo com os URLs reais — ver docs/RENDER.md.
# =============================================================================================

services:
  # -------------------------------------------------------------------------------------------
  # 1. API Laravel 12 (Docker, plano free: 512 MB RAM, adormece após 15 min sem tráfego)
  # -------------------------------------------------------------------------------------------
  - type: web
    name: erp-consulvolt-render-api
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/hdsgeral-boop/erp_consulvolt
    branch: render
    autoDeploy: true
    dockerfilePath: ./docker/render/Dockerfile.render
    dockerContext: .
    healthCheckPath: /up
    buildFilter:
      paths:
        - backend/**
        - docker/render/**
        - render.yaml
      ignoredPaths:
        - backend/tests/**
    envVars:
      # ---- Aplicação
      - key: APP_NAME
        value: ERP Consulvolt
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY                       # base64:... (gerar localmente — docs/RENDER.md). NUNCA mudar depois.
        sync: false
      - key: APP_URL
        value: https://erp-consulvolt-render-api.onrender.com
      - key: APP_TIMEZONE
        value: Africa/Luanda
      - key: APP_LOCALE
        value: pt
      - key: APP_FALLBACK_LOCALE
        value: pt
      - key: APP_FAKER_LOCALE
        value: pt_PT
      - key: APP_MAINTENANCE_DRIVER
        value: file
      - key: HASH_DRIVER
        value: argon2id
      - key: BCRYPT_ROUNDS
        value: "12"

      # ---- Logs (stdout/stderr -> painel de logs da Render)
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_STDERR_FORMATTER
        value: Monolog\Formatter\JsonFormatter
      - key: LOG_LEVEL
        value: info
      - key: LOG_DEPRECATIONS_CHANNEL
        value: "null"

      # ---- Base de dados: Supabase (Session pooler, IPv4, porta 5432, SSL obrigatório)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST                       # Supabase › Session pooler (projeto ysjxfrolufcdjhqxuejo, eu-west-1)
        value: aws-0-eu-west-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME                   # postgres.<project-ref>
        value: postgres.ysjxfrolufcdjhqxuejo
      - key: DB_PASSWORD                   # segredo: só no painel da Render
        sync: false
      - key: DB_SSLMODE
        value: require

      # ---- Sem Redis (plano gratuito): cache em ficheiro (suporta Cache::lock numa instância),
      #      sessão em cookie (API só Bearer/Sanctum) e filas síncronas.
      - key: CACHE_STORE
        value: file
      - key: CACHE_PREFIX
        value: "erp:"
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: local

      # ---- Autenticação e CORS (o SPA está noutra origem: autorizar só o Static Site)
      - key: SANCTUM_STATEFUL_DOMAINS
        value: ""
      - key: ERP_CORS_ORIGENS
        value: https://erp-consulvolt-render-web.onrender.com
      - key: ERP_SESSAO_INATIVIDADE_MINUTOS
        value: "15"
      - key: ERP_SESSAO_VALIDADE_HORAS
        value: "12"
      - key: ERP_SESSAO_TENTATIVAS_POR_MINUTO
        value: "5"
      - key: ERP_SESSAO_TENTATIVAS_POR_MINUTO_IP
        value: "60"
      - key: ERP_API_PEDIDOS_POR_MINUTO
        value: "300"

      # ---- E-mail (o ERP só regista; sem envio real)
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: nao-responder@consulvolt.ao
      - key: MAIL_FROM_NAME
        value: ERP Consulvolt

      # ---- Facturação electrónica AGT: desligada (as chaves PEM não existem neste ambiente)
      - key: AGT_DRIVER
        value: desligado
      - key: AGT_AMBIENTE
        value: homologacao

      # ---- Assistente IA (opcional; vazio = desligado)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ERP_IA_MODELO
        value: claude-opus-5-5
      - key: ERP_IA_ESFORCO
        value: medium

      # ---- Contentor (afinado para 512 MB)
      - key: PHP_MEMORY_LIMIT
        value: 256M
      - key: PHP_FPM_MAX_CHILDREN
        value: "4"
      - key: ERP_MIGRAR_NO_ARRANQUE        # 1 = php artisan migrate --force em cada arranque
        value: "1"
      - key: ERP_SCHEDULER                 # true = corre schedule:work dentro do contentor
        value: "false"

  # -------------------------------------------------------------------------------------------
  # 2. Frontend Vite SPA (Static Site gratuito, CDN global)
  # -------------------------------------------------------------------------------------------
  - type: web
    name: erp-consulvolt-render-web
    runtime: static
    repo: https://github.com/hdsgeral-boop/erp_consulvolt
    branch: render
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - frontend/**
      ignoredPaths:
        - frontend/e2e/**
    envVars:
      - key: VITE_API_URL                  # origem da API SEM /api no fim (lida no build: mudar => novo deploy)
        value: https://erp-consulvolt-render-api.onrender.com
      - key: NODE_VERSION
        value: "22"
    # Rotas do React Router: qualquer caminho sem ficheiro devolve o index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # CSP igual à da produção AWS, mas com a API noutra origem no connect-src.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://erp-consulvolt-render-api.onrender.com; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
