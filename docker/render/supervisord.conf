; supervisord da imagem Render: mantém nginx e PHP-FPM vivos no mesmo contentor (e o scheduler, se ERP_SCHEDULER=true).
; Corre como www-data; sem socket de controlo (não é preciso supervisorctl). Tudo vai para stdout/stderr (logs da Render).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/erp-render/supervisord.pid
loglevel=warn

[program:php-fpm]
command=php-fpm -F
priority=10
autorestart=true
startsecs=2
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -e stderr -c /tmp/erp-render/nginx.conf -g "daemon off;"
priority=20
autorestart=true
startsecs=2
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Agendador (ciclo AGT, câmbios BAI, contratos expirados). Desligado por omissão: no plano free o serviço
; adormece após 15 min sem tráfego e cada execução por minuto consome RAM/CPU partilhadas com a API.
[program:scheduler]
command=php /var/www/html/artisan schedule:work --no-ansi
autostart=%(ENV_ERP_SCHEDULER)s
autorestart=true
priority=30
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
