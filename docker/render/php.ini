; PHP da imagem Render (sobre o php.ini-production oficial). O memory_limit vem da variável PHP_MEMORY_LIMIT
; (256M por omissão: com 4 processos FPM cabe nos 512 MB do plano free).

date.timezone = Africa/Luanda
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000
upload_max_filesize = 100M
post_max_size = 100M
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
allow_url_include = Off
session.use_strict_mode = 1
zend.exception_ignore_args = On

; Código imutável dentro da imagem: o OPcache não revalida ficheiros.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.max_wasted_percentage = 10

realpath_cache_size = 4096K
realpath_cache_ttl = 600
