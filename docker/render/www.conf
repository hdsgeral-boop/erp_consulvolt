; Pool PHP-FPM da imagem Render (512 MB de RAM). Carregado depois do zz-docker.conf da imagem oficial,
; por isso o «listen» abaixo prevalece: o FPM só aceita ligações do nginx do próprio contentor.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000
; ondemand: sem processos parados a gastar memória quando a API está inactiva.
pm = ondemand
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 300s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
access.log = /dev/null
