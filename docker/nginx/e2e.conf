# Nginx do ambiente E2E (docker-compose.e2e.yml): serve o SPA (frontend/dist) e encaminha /api para app_e2e (base erp_consulvolt_e2e).
server {
    listen 80;
    server_name _;
    root /var/www/frontend;
    index index.html;

    client_max_body_size 100M;   # carregamento do backup legado (~57 MB) e anexos
    server_tokens off;

    # DNS interno do Docker: o upstream é resolvido de novo quando o contentor `app_e2e` é recriado
    # (sem isto o Nginx fica com o IP antigo e devolve 502 até ser reiniciado).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app_e2e:9000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # API Laravel
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 180s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Health-check nativo do Laravel
    location = /up {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Activos estáticos do SPA com cache longa (ficheiros com hash no nome)
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires off;   # E2E: sem cache, cada build novo é servido de imediato
        access_log off;
        try_files $uri =404;
    }

    # Rotas do SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
