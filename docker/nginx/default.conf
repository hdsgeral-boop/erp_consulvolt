# Nginx: serve os activos compilados do SPA (frontend/dist, em /build/) e encaminha tudo o resto para o Laravel (php-fpm no
# serviço `app`). A página de entrada (ERP ou plataforma SaaS, escolhida pelo host) é uma view Blade servida pelo Laravel.
server {
    listen 80;
    server_name _;
    root /var/www/frontend;

    client_max_body_size 100M;   # carregamento do backup legado (~57 MB) e anexos
    server_tokens off;

    # DNS interno do Docker: o upstream é resolvido de novo quando o contentor `app` é recriado
    # (sem isto o Nginx fica com o IP antigo e devolve 502 até ser reiniciado).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # Activos do Vite (frontend/dist montado em /var/www/frontend/build): ficheiros com hash no nome, cache longa
    location ^~ /build/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Tudo o resto (API /api, /up e as páginas do SPA) é do Laravel; a escolha da página por host também.
    location / {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 180s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
