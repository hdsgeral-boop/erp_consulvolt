# Nginx: serve o SPA React (frontend/dist) e encaminha /api para o Laravel (php-fpm no serviço `app`).
server {
    listen 80;
    server_name _;
    root /var/www/frontend;
    index index.html;

    client_max_body_size 100M;   # carregamento do backup legado (~57 MB) e anexos
    server_tokens off;

    # DNS interno do Docker: o upstream é resolvido de novo quando o contentor `app` é recriado
    # (sem isto o Nginx fica com o IP antigo e devolve 502 até ser reiniciado).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # API Laravel
    # Falhas geradas pelo próprio Nginx na API (upstream em baixo, demasiado grande): resposta JSON no contrato de erro,
    # sem a página HTML por omissão (que denuncia o servidor). docs/qualidade/MENSAGENS_ERRO.md
    location @api_indisponivel {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"sucesso":false,"mensagem":"Serviço temporariamente indisponível. Tente novamente dentro de instantes.","codigo":"INDISPONIVEL","dados":null,"metadados":{}}';
    }
    location @api_demasiado_grande {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"sucesso":false,"mensagem":"O pedido ou ficheiro enviado é demasiado grande.","codigo":"PEDIDO_DEMASIADO_GRANDE","dados":null,"metadados":{}}';
    }

    location ^~ /api/ {
        error_page 413 = @api_demasiado_grande;
        error_page 502 503 504 = @api_indisponivel;
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 180s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Health-check nativo do Laravel
    location = /up {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Login com o Google (AutenticacaoGoogleController, routes/web.php): fora de /api de propósito (sessão Laravel
    # nativa para o state anti-CSRF do Socialite) — sem isto cai nas "Rotas do SPA" e nunca chega ao Laravel.
    location ^~ /auth/google/ {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # Activos estáticos do SPA com cache longa (ficheiros com hash no nome)
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Rotas do SPA — o index.html nunca fica em cache, senão o navegador continua a pedir os ficheiros da versão anterior
    location / {
        # (um add_header aqui anula os do server: repetem-se os de segurança)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
