# Nginx: serve o SPA React (frontend/dist) e encaminha /api para o Laravel (php-fpm no serviço `app`).
# Página inicial por host: <DOMINIO_PLATAFORMA>.* (por defeito gestao-admin.*) serve a aplicação da plataforma SaaS
# (plataforma.html); todos os outros hosts servem o ERP (index.html). O valor vem do modelo (envsubst do nginx).
map $host $pagina_inicial {
    default /index.html;
    ~^${DOMINIO_PLATAFORMA}\. /plataforma.html;
}

server {
    listen 80;
    server_name _;
    root /var/www/frontend;
    index index.html;

    client_max_body_size 100M;   # carregamento do backup legado (~57 MB) e anexos
    server_tokens off;

    # DNS interno do Docker: o upstream é resolvido de novo quando o contentor `app` é recriado
    # (sem isto o Nginx fica com o IP antigo e devolve 502 até ser reiniciado).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # API Laravel
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 180s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Health-check nativo do Laravel
    location = /up {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Activos estáticos do SPA com cache longa (ficheiros com hash no nome)
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Raiz: por host (sem isto o `index` serviria sempre index.html)
    location = / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $pagina_inicial =404;
    }

    # Rotas do SPA — o index.html nunca fica em cache, senão o navegador continua a pedir os ficheiros da versão anterior
    location / {
        # (um add_header aqui anula os do server: repetem-se os de segurança)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $pagina_inicial;
    }
}
