# Contexto http do nginx de PRODUÇÃO (incluído antes do server em /etc/nginx/conf.d/).

# Logs em JSON para o stdout (recolhidos pelo driver json-file do Docker, com rotação no compose).
log_format erp_json escape=json
  '{"ts":"$time_iso8601","ip":"$remote_addr","metodo":"$request_method","uri":"$request_uri",'
  '"estado":$status,"bytes":$body_bytes_sent,"duracao":$request_time,"upstream":"$upstream_response_time",'
  '"referer":"$http_referer","agente":"$http_user_agent","pedido_id":"$request_id"}';

# IP real do cliente quando atrás do reverse proxy HTTPS do servidor (Caddy/nginx/Traefik).
# Só se confia em X-Forwarded-For vindo de redes privadas (o proxy do host / rede Docker).
# O proxy TEM de definir (não acrescentar) o cabeçalho: X-Forwarded-For $remote_addr.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1/32;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# HTTPS terminado no proxy: o Laravel vê HTTPS=on (URLs e cookies seguros) e o browser recebe HSTS.
map $http_x_forwarded_proto $erp_https {
  default "";
  https   on;
}
map $http_x_forwarded_proto $erp_hsts {
  default "";
  https   "max-age=31536000; includeSubDomains";
}

# Protecção adicional do login contra força bruta (o backend já limita por utilizador+IP).
limit_req_zone $binary_remote_addr zone=erp_login:10m rate=20r/m;
limit_req_status 429;

# Compressão
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml
           application/xml+rss image/svg+xml application/vnd.ms-fontobject font/ttf font/otf;

# Limites e timeouts
client_max_body_size 25M;       # importações .xlsx/.csv (máx. 20 MB no Laravel) e JSON; 100M só em /api/sistema/copias
client_body_buffer_size 128k;
client_header_timeout 30s;
client_body_timeout 120s;
send_timeout 120s;
server_tokens off;
