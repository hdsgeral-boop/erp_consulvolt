# Cabeçalhos de segurança (incluído em CADA bloco com add_header: no nginx, um add_header num location
# anula todos os herdados do server).
#
# CSP do SPA (React + Ant Design 5):
#  - script-src 'self': só os bundles do Vite; SEM 'unsafe-eval' e sem scripts inline.
#    As impressões (iframe sem scripts) são accionadas a partir da janela principal: não há handlers inline.
#  - style-src 'unsafe-inline': o Ant Design 5 injecta <style> em execução (CSS-in-JS).
#  - img-src data:/blob:: logótipos em base64, QR em SVG (data:) e pré-visualizações de descargas.
#  - connect-src 'self': a API está na mesma origem (/api).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Request-Id $request_id always;
# Só é enviado quando o pedido chegou por HTTPS ao proxy (valor vazio = cabeçalho omitido).
add_header Strict-Transport-Security $erp_hsts always;
