# nginx de PRODUÇÃO: serve o SPA React construído (dentro da imagem) e encaminha /api para o Laravel.
# Corre sem root (imagem nginx-unprivileged) na porta 8080. O HTTPS é terminado no reverse proxy do servidor.
server {
    listen 8080;
    server_name _;
    root /var/www/frontend;
    index index.html;
    keepalive_timeout 30s;   # o nginx.conf base define 65 s no http; aqui reduz-se por servidor

    access_log /dev/stdout erp_json;
    error_log /dev/stderr warn;

    # DNS interno do Docker: o upstream é resolvido de novo quando o contentor app é recriado (sem 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    include /etc/nginx/snippets/cabecalhos-seguranca.conf;

    # Saúde do próprio nginx (healthcheck do contentor; não toca no PHP).
    location = /nginx-saude {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Login: limite por IP antes de chegar ao PHP.
    location = /api/autenticacao/entrar {
        limit_req zone=erp_login burst=10 nodelay;
        include /etc/nginx/snippets/fastcgi-laravel.conf;
    }

    # Cópias de empresa (exportação/importação de ficheiros grandes): único sítio com 100 MB.
    location ^~ /api/sistema/copias {
        client_max_body_size 100M;
        include /etc/nginx/snippets/fastcgi-laravel.conf;
    }

    # API Laravel
    # Falhas geradas pelo próprio Nginx na API (upstream em baixo, demasiado grande): resposta JSON no contrato de erro,
    # sem a página HTML por omissão (que denuncia o servidor). docs/qualidade/MENSAGENS_ERRO.md
    location @api_indisponivel {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"sucesso":false,"mensagem":"Serviço temporariamente indisponível. Tente novamente dentro de instantes.","codigo":"INDISPONIVEL","dados":null,"metadados":{}}';
    }
    location @api_demasiado_grande {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"sucesso":false,"mensagem":"O pedido ou ficheiro enviado é demasiado grande.","codigo":"PEDIDO_DEMASIADO_GRANDE","dados":null,"metadados":{}}';
    }

    location ^~ /api/ {
        error_page 413 = @api_demasiado_grande;
        error_page 502 503 504 = @api_indisponivel;
        include /etc/nginx/snippets/fastcgi-laravel.conf;
    }

    # Health-check nativo do Laravel
    location = /up {
        access_log off;
        include /etc/nginx/snippets/fastcgi-laravel.conf;
    }

    # Login com o Google (AutenticacaoGoogleController, routes/web.php): fora de /api de propósito, para usar a
    # sessão Laravel nativa (state anti-CSRF do Socialite) em vez do token/cookie da API — sem isto, cairia no
    # bloco "Rotas do SPA" abaixo e o nginx serviria o index.html em vez de chegar ao Laravel.
    location ^~ /auth/google/ {
        include /etc/nginx/snippets/fastcgi-laravel.conf;
    }

    # Ficheiros ocultos (.env, .git, …) nunca são servidos.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Activos do Vite com hash no nome: imutáveis, cache de 1 ano.
    location ^~ /assets/ {
        access_log off;
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Outros estáticos sem hash (favicon, imagens soltas): cache curta.
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|woff2?|ttf)$ {
        access_log off;
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # index.html nunca em cache: cada deploy passa a servir os novos bundles de imediato.
    location = /index.html {
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Rotas do SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
