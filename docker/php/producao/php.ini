; Configuração PHP de PRODUÇÃO do ERP_CONSULVOLT (aplicada sobre o php.ini-production oficial).
; O código está dentro da imagem e nunca muda em execução: o OPcache não revalida ficheiros
; (validate_timestamps=0). Cada nova versão é uma imagem nova, logo uma cache nova.

date.timezone = Africa/Luanda
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000
upload_max_filesize = 100M
post_max_size = 100M
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
allow_url_include = Off
session.use_strict_mode = 1
zend.exception_ignore_args = On

; OPcache afinado para código imutável
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.max_wasted_percentage = 10
opcache.huge_code_pages = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
