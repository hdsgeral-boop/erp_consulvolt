; Pool PHP-FPM de PRODUÇÃO. O processo mestre corre como www-data (imagem sem root),
; por isso as directivas user/group do pool por omissão são ignoradas (aviso inofensivo no arranque).
[www]
listen = 9000
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}
pm.max_requests = 1000
request_terminate_timeout = 300s
; Pedidos lentos ficam no log (stderr) com o stack trace, para diagnóstico.
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
; Endpoints internos (só alcançáveis na rede Docker; o nginx não os expõe).
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-estado
