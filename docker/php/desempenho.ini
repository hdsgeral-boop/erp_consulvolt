; Montado pelo docker-compose depois do zz-erp.ini (prevalece). Controlado pelo .env da raiz:
;   PHP_OPCACHE_VALIDAR=1 (omissão, desenvolvimento) — revalida o código montado a cada 2 s;
;   PHP_OPCACHE_VALIDAR=0 (produção neste PC)         — não volta a ler os .php pela montagem Windows (lenta): cada
;     pedido poupa centenas de stat(). Depois de alterar código: docker compose restart app worker scheduler.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDAR:-1}
